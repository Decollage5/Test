<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>TETRIS</h1>
    <div class="game-area">
      <div class="board-wrapper">
        <canvas id="board" width="240" height="480"></canvas>
        <div id="overlay" class="overlay">
          <p id="overlay-text">Tetris</p>
          <button id="start-btn">Start</button>
        </div>
      </div>
      <div class="sidebar">
        <div class="panel">
          <h2>Nächster Stein</h2>
          <canvas id="next" width="100" height="100"></canvas>
        </div>
        <div class="panel">
          <h2>Punkte</h2>
          <p id="score">0</p>
        </div>
        <div class="panel">
          <h2>Level</h2>
          <p id="level">1</p>
        </div>
        <div class="panel">
          <h2>Reihen</h2>
          <p id="lines">0</p>
        </div>
        <div class="panel controls">
          <h2>Steuerung</h2>
          <ul>
            <li>&larr; &rarr; Bewegen</li>
            <li>&uarr; Drehen</li>
            <li>&darr; Weich fallen</li>
            <li>Leertaste Hart fallen</li>
            <li>P Pause</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
