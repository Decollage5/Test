<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dividendenkalender</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Dividendenkalender</h1>
    <div class="year-nav">
      <button id="prev-year" aria-label="Vorheriges Jahr">&larr;</button>
      <span id="year"></span>
      <button id="next-year" aria-label="Nächstes Jahr">&rarr;</button>
    </div>
  </header>

  <main>
    <section class="summary">
      <div class="stat"><h2>Jahr brutto</h2><p id="total-gross">0,00 €</p></div>
      <div class="stat"><h2>Jahr netto</h2><p id="total-net">0,00 €</p></div>
      <div class="stat"><h2>Ø pro Monat (netto)</h2><p id="avg-month">0,00 €</p></div>
      <div class="stat">
        <h2>Steuersatz</h2>
        <p><input id="tax-rate" type="number" min="0" max="100" step="0.01"> %</p>
      </div>
    </section>

    <section class="calendar" id="calendar"></section>

    <section class="panel">
      <h2 id="form-title">Position hinzufügen</h2>
      <form id="position-form">
        <input type="hidden" id="edit-id">
        <label>Name / Ticker
          <input id="name" required placeholder="z. B. Allianz">
        </label>
        <label>Stückzahl
          <input id="shares" type="number" min="0" step="any" required>
        </label>
        <label>Dividende je Aktie und Zahlung (€)
          <input id="dividend" type="number" min="0" step="any" required>
        </label>
        <label>Zahltag (Tag im Monat, optional)
          <input id="day" type="number" min="1" max="31">
        </label>
        <fieldset>
          <legend>Zahlungsmonate</legend>
          <div id="months" class="months"></div>
          <div class="presets">
            <button type="button" data-preset="1">Monatlich</button>
            <button type="button" data-preset="3">Quartalsweise</button>
            <button type="button" data-preset="6">Halbjährlich</button>
            <button type="button" data-preset="12">Jährlich</button>
            <button type="button" data-preset="0">Keine</button>
          </div>
        </fieldset>
        <div class="actions">
          <button type="submit" id="submit-btn">Hinzufügen</button>
          <button type="button" id="cancel-edit" hidden>Abbrechen</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Positionen</h2>
      <table>
        <thead>
          <tr><th>Name</th><th>Stück</th><th>Div./Zahlung</th><th>Monate</th><th>Jahr brutto</th><th></th></tr>
        </thead>
        <tbody id="positions"></tbody>
      </table>
      <p id="empty" class="muted">Noch keine Positionen erfasst.</p>
      <div class="actions">
        <button id="export">Export (JSON)</button>
        <label class="file-btn">Import (JSON)<input id="import" type="file" accept="application/json" hidden></label>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
